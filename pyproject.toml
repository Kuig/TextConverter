[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textconverter"
version = "0.1.1"
description = "TextConverter — Multi-format document converter with AI-powered image description and heuristic code detection."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kuig", email = "kuig.music@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "mcp>=1.2.0",
    "streamlit"
]
keywords = ["pdf", "markdown", "latex", "html", "json", "converter", "ai", "mcp", "streamlit", "code-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
ai = [
    "unified-ai-client"
]

[project.urls]
Homepage = "https://github.com/Kuig/TextConverter"
Repository = "https://github.com/Kuig/TextConverter"
"Bug Tracker" = "https://github.com/Kuig/TextConverter/issues"

[project.scripts]
textconverter = "textconverter.__main__:main"

[tool.setuptools.packages.find]
include = ["textconverter*"]

